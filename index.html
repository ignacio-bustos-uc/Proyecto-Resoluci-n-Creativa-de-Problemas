 for(let i=0;i<22;i++){const x=i*62-130;outer+=`<rect x="${x}" y="-39" width="46" height="74" rx="2" transform="rotate(-7 ${x} 0)"/><rect x="${x+120}" y="787" width="49" height="66" rx="2" transform="rotate(-5 ${x+120} 787)"/>`;}
 const labels=[[68,570,'AV. VICUÑA MACKENNA',80],[537,279,'Patio central',0],[452,726,'Ingeniería',-6],[722,123,'Comercial',-6],[895,460,'Biblioteca Central',80],[291,173,'Humanidades',-7],[1107,470,'Canchas',0],[762,661,'Gauss',-7],[1051,237,'DAE',0]];
 let trees='';
 for(const [x,y] of [[505,109],[535,178],[523,308],[602,311],[371,141],[236,390],[490,481],[545,456],[303,540],[1029,189],[1080,300],[987,645],[838,721],[189,685],[1073,578],[729,337]]){
  for(const [dx,dy,rad] of [[0,0,6],[9,4,5],[-4,9,5]])trees+=`<circle cx="${x+dx}" cy="${y+dy}" r="${rad}" fill="#b4cbaa" opacity=".68"/>`;
 }
 return `<svg class="basemap" viewBox="0 0 1255 811" aria-hidden="true" style="overflow:visible"><defs><pattern id="lawns" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r=".8" fill="#84a47c" opacity=".25"/></pattern></defs><rect x="-1600" y="-1200" width="4455" height="3211" fill="#eaece3"/><g fill="#d9dcd3" stroke="#c9cec4">${outer}</g>${areas.map(p=>svgPoly(p,'#cbdcc0')).join('')}${areas.map(p=>svgPoly(p,'url(#lawns)')).join('')}${blocks.map(p=>svgPoly(p,'#d2d5cb','#bfc5ba')).join('')}${minor.map(d=>road(d,5,'#fafbf4')).join('')}${major.map(d=>road(d,13,'#cdd2c7')+road(d,10,'#fbfcf6')).join('')}<circle cx="576" cy="220" r="10" fill="#aecac4" stroke="#f9fbf4" stroke-width="4"/><path d="M1174 450q19-26 38-9t9 43q-30 22-49-2z" fill="#b6cecc"/>${trees}<g fill="#758374" font-family="Segoe UI,Arial" font-weight="600" font-size="13" text-anchor="middle" paint-order="stroke" stroke="#edf0e6" stroke-width="3">${labels.map(([x,y,t,ang])=>`<text transform="translate(${x} ${y}) rotate(${ang})">${t}</text>`).join('')}</g></svg>`;
}
$('sheet').innerHTML=campusPlan();
let filter='all',visible=rooms,selected=null,zoom=1,base=1,ox=0,oy=0,previous=null;
const map=$('map'),pins=new Map();
const leaders=document.createElementNS('http://www.w3.org/2000/svg','svg');
leaders.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
$('markers').append(leaders);
for(const r of rooms){
 const [kind,label]=state(r),pin=document.createElement('button');pin.className='pin '+kind;
 pin.setAttribute('aria-label',`${r.name}, ${r.floor}, ${r.free} puestos libres`);
 pin.innerHTML=`<span class="bubble">${icon(r.type)}</span><span class="tip">${r.name} · ${r.floor}</span>`;
 pin.addEventListener('click',()=>openRoom(r,pin));$('markers').append(pin);pins.set(r.id,pin);
}
const scale=()=>base*zoom;
function draw(){
 const s=scale(),w=map.clientWidth,h=map.clientHeight;
 ox=Math.min(w*.5,Math.max(w*.5-1255*s,ox));oy=Math.min(h*.5,Math.max(h*.5-811*s,oy));
 $('sheet').style.cssText=`width:1255px;height:811px;transform:translate(${ox}px,${oy}px) scale(${s})`;
 const placed=[],lines=[];
 for(const r of visible){
  const px=ox+r.x*s,py=oy+r.y*s;let x=px,y=py;
  // Separa los puntos cercanos en pantalla sin cambiar la ubicación de la sala.
  const clear=(a,b)=>placed.every(p=>Math.hypot(a-p.x,b-p.y)>=33);
  for(let ring=1;!clear(x,y)&&ring<=6;ring++){
   for(let k=0;k<12;k++){const ang=k*Math.PI/6;x=px+35*ring*Math.cos(ang);y=py+35*ring*Math.sin(ang);if(clear(x,y))break;}
  }
  placed.push({x,y});const pin=pins.get(r.id);pin.style.left=x+'px';pin.style.top=y+'px';
  if(Math.hypot(x-px,y-py)>3)lines.push(`<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" stroke="#688673" stroke-width="1.2"/>`);
 }
 leaders.innerHTML=lines.join('');$('minus').disabled=zoom<=1;$('plus').disabled=zoom>=4;
}
function fit(){const w=map.clientWidth,h=map.clientHeight;if(!w||!h)return;base=Math.min(w/1160,h/830);zoom=1;ox=w/2-575*base;oy=h/2-406*base;draw();}
function magnify(factor,x=map.clientWidth/2,y=map.clientHeight/2){
 const old=zoom;zoom=Math.min(4,Math.max(1,zoom*factor));ox=x-(x-ox)*zoom/old;oy=y-(y-oy)*zoom/old;draw();
}
$('plus').onclick=()=>magnify(1.4);$('minus').onclick=()=>magnify(1/1.4);$('reset').onclick=fit;
map.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const b=map.getBoundingClientRect();magnify(Math.exp(-e.deltaY*.01),e.clientX-b.left,e.clientY-b.top);},{passive:false});
let drag=null;
map.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.button!==0||drag)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};map.setPointerCapture(e.pointerId);map.classList.add('drag');});
map.addEventListener('pointermove',e=>{if(drag?.id!==e.pointerId)return;ox+=e.clientX-drag.x;oy+=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;draw();});
map.addEventListener('lostpointercapture',()=>{drag=null;map.classList.remove('drag')});
function render(){
 const query=norm($('search').value.trim());
 visible=rooms.filter(r=>(filter!=='free'||r.free>0)&&(filter!=='plug'||r.plug)&&norm(r.name+' '+r.floor).includes(query));
 const ids=new Set(visible.map(r=>r.id));pins.forEach((p,id)=>p.hidden=!ids.has(id));
 $('count').textContent=visible.length;$('announce').textContent=`${visible.length} espacios en el mapa`;
 $('list').innerHTML=visible.map(r=>`<button class="room" data-id="${r.id}"><span class="roomicon ${r.type==='book'?'library':''}">${icon(r.type)}</span><span class="roominfo"><b>${r.name}</b><small>${r.floor}</small></span><span class="free ${state(r)[0]}">${r.free?r.free+' libres':'Completo'}</span></button>`).join('')||'<p class="empty">Ningún espacio coincide con tu búsqueda. Prueba otro nombre o filtro.</p>';
 draw();
}
function openRoom(r,trigger){
 if(selected!==null)pins.get(selected).classList.remove('active');selected=r.id;previous=trigger;pins.get(r.id).classList.add('active');
 const [kind,label]=state(r);
 const attr=(symbol,title,value)=>`<div class="attr">${icon(symbol)}${title}<strong class="${value==='No'?'no':''}">${value}</strong></div>`;
 $('detail').innerHTML=`<div class="detailbar"><button class="back" id="back">${icon('back')}Directorio</button></div><div class="roomicon ${r.type==='book'?'library':''}">${icon(r.type)}</div><h2 tabindex="-1" id="roomtitle">${r.name}</h2><p class="loc">${icon('pin')}${r.floor} · Campus San Joaquín</p><div class="occ ${kind}"><div class="smallrow">Ocupación<span class="status"><i class="dot"></i>${label}</span></div><div class="ratio" aria-label="${r.used} de ${r.total} puestos ocupados">${r.used}<span>/${r.total}</span></div><div class="meter"><i style="width:${100*r.used/r.total}%"></i></div><p><strong>${r.free}</strong> ${r.free===1?'puesto libre':'puestos libres'}</p></div><h3>Características del espacio</h3>${attr('plug','Enchufes',r.plug?'Sí':'No')}${attr('air','Aire acondicionado',r.air?'Sí':'No')}${attr('box','Bodega',r.store?'Sí':'No')}${attr('noise','Ambiente',r.sound)}`;
 $('sidehead').hidden=true;$('list').hidden=true;$('detail').hidden=false;$('detail').scrollTop=0;
 $('back').onclick=closeRoom;$('roomtitle').focus({preventScroll:true});
 if(trigger.classList.contains('room')){ox=map.clientWidth/2-r.x*scale();oy=map.clientHeight/2-r.y*scale();draw();}
}
function closeRoom(){
 if(selected===null)return;pins.get(selected).classList.remove('active');selected=null;
 $('detail').hidden=true;$('sidehead').hidden=false;$('list').hidden=false;previous?.focus({preventScroll:true});
}
$('list').addEventListener('click',e=>{const el=e.target.closest('.room');if(el)openRoom(rooms[Number(el.dataset.id)],el);});
$('search').addEventListener('input',render);
document.querySelectorAll('.chip').forEach(chip=>chip.onclick=()=>{filter=chip.dataset.filter;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(c===chip)));render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRoom();});
new ResizeObserver(fit).observe(map);fit();render();
</script>
</body></html>
